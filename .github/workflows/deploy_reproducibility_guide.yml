name: Deploy reproducibility guide

on:
  push:
    branches:
      - main
    paths:
      - "reproducibility_guide/**"
      - ".github/workflows/deploy_reproducibility_guide.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reproducibility_guide/requirements.txt

      - name: Install Jupyter Book
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reproducibility_guide/requirements.txt

      - name: Build reproducibility guide
        run: jupyter-book build reproducibility_guide

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload rendered guide
        uses: actions/upload-pages-artifact@v4
        with:
          path: reproducibility_guide/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
