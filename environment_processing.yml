name: processing
channels:
  - conda-forge
  - MRtrix3
dependencies:
  # Runtime and command-line tools used directly by retained workflows.
  - python=3.11
  - pip
  - mrtrix3=3.0.4

  # Direct Python dependencies imported by retained processing, analysis,
  # figure, or shared utility code. Pip resolves their transitive packages.
  # PyMP2RAGE has no published release and documents installation from Git.
  - pip:
      - antspyx==0.6.3
      - imgcat==0.6.0
      - lxml==5.4.0
      - matplotlib==3.10.3
      - missingno==0.5.2
      - nibabel==5.3.2
      - nilearn==0.11.1
      - nireports==25.2.0
      - numpy==1.26.4
      - pandas==2.2.3
      - pybids==0.19.0
      - pyyaml==6.0.2
      - scipy==1.15.2
      - seaborn==0.13.2
      - tedana==26.0.3
      - tqdm==4.67.1
      - git+https://github.com/Gilles86/pymp2rage.git
